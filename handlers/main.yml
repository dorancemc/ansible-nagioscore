---
- name: Restart apache
  ansible.builtin.service:
    name: "{{ apache.service_name }}"
    state: restarted
    enabled: true

- name: Reload nagios
  ansible.builtin.service:
    name: "{{ nagios.service_name }}"
    state: reloaded

- name: Reload systemd daemon
  ansible.builtin.systemd_service:
    daemon_reload: true

- name: Restart npcd
  ansible.builtin.systemd_service:
    name: npcd
    state: restarted
    enabled: true
    daemon_reload: true

---

- name: Create host definition
  vars:
    __host_vars: "{{ lookup('ansible.builtin.file', __nagios_host_file) | from_yaml }}"
    __host: "{{ __host_vars._host | default({}) }}"
  ansible.builtin.template:
    src: nagios/etc/assets/host_definition.cfg
    dest: "{{ ansible_nagioscore_config_tempfolder.path }}/hosts/{{ __host.host_name }}.cfg"
    mode: "0664"
    force: "{{ nagioscore_config_mode == 'always' }}"
  when: __host | length > 0

- name: Create service definition
  vars:
    __host_vars: "{{ lookup('ansible.builtin.file', __nagios_host_file) | from_yaml }}"
    __host: "{{ __host_vars._host | default({}) }}"
    __services: "{{ __host_vars._services | default({}) }}"
  ansible.builtin.template:
    src: nagios/etc/assets/service_definition.cfg
    dest: "{{ ansible_nagioscore_config_tempfolder.path }}/services/{{ __host.host_name }}.cfg"
    mode: "0664"
    force: "{{ nagioscore_config_mode == 'always' }}"
  when: __services | length > 0

---
- name: Check if pnp4nagios folder exists
  ansible.builtin.stat:
    path: /usr/local/pnp4nagios
  register: ansible_nagioscore_pnp4nagios_path

- name: Create temporary directory
  ansible.builtin.tempfile:
    state: directory
    suffix: pnp4nagios
  register: ansible_nagioscore_pnp4nagios_tempfolder
  changed_when: false
  when: not ansible_nagioscore_pnp4nagios_path.stat.exists or pnp4nagios_force_reinstall | bool

- name: Download pnp4nagios archive
  ansible.builtin.unarchive:
    src: https://downloads.sourceforge.net/project/pnp4nagios/PNP-0.6/pnp4nagios-0.6.26.tar.gz
    dest: "{{ ansible_nagioscore_pnp4nagios_tempfolder.path }}"
    remote_src: true
    creates: "{{ ansible_nagioscore_pnp4nagios_tempfolder.path }}/pnp4nagios-0.6.26"
  when: not ansible_nagioscore_pnp4nagios_path.stat.exists or pnp4nagios_force_reinstall | bool

- name: Build and install pnp4nagios
  ansible.builtin.command:
    chdir: "{{ ansible_nagioscore_pnp4nagios_tempfolder.path }}/pnp4nagios-0.6.26"
    cmd: "{{ item }}"
    creates: /etc/httpd/conf.d/pnp4nagios.conf
  loop:
    - ./configure
    - make all
    - make fullinstall
  when: not ansible_nagioscore_pnp4nagios_path.stat.exists or pnp4nagios_force_reinstall | bool
  changed_when: true
  failed_when: ansible_nagioscore_pnp4nagios_build.results | default([]) | selectattr('rc', 'defined') | rejectattr('rc', 'equalto', 0) | list | length > 0
  register: ansible_nagioscore_pnp4nagios_build

- name: Download api.php for grafana integration
  ansible.builtin.get_url:
    url: https://github.com/lingej/pnp-metrics-api/raw/master/application/controller/api.php
    dest: /usr/local/pnp4nagios/share/application/controllers/api.php
    checksum: sha1:56fd36b2dde0fc6ab618740e8b2f877d0e6065ae
    mode: "0644"

- name: Deploy pnp4nagios apache configuration
  ansible.builtin.template:
    src: pnp4nagios/pnp4nagios.conf
    dest: "{{ apache.sites_folder }}/pnp4nagios.conf"
    mode: "0644"
  notify: restart apache

- name: Check pnp4nagios install.php file
  ansible.builtin.stat:
    path: /usr/local/pnp4nagios/share/install.php
  register: ansible_nagioscore_pnp4nagios_install_stat

- name: Rename install.php to install.old
  ansible.builtin.command:
    cmd: mv /usr/local/pnp4nagios/share/install.php /usr/local/pnp4nagios/share/install.old
  when: ansible_nagioscore_pnp4nagios_install_stat.stat.exists
  changed_when: true
  failed_when: ansible_nagioscore_pnp4nagios_install_rename.rc != 0
  register: ansible_nagioscore_pnp4nagios_install_rename

- name: Fix process_perfdata.pl perl variable
  ansible.builtin.replace:
    path: /usr/local/pnp4nagios/libexec/process_perfdata.pl
    regexp: 'my \$t1;'
    replace: 'my @t1=();\n    my $t1=\\@t1;'

- name: Fix data.php pages check
  ansible.builtin.replace:
    path: /usr/local/pnp4nagios/share/application/models/data.php
    regexp: 'if\(sizeof\(\$pages'
    replace: 'if(is_array($pages) && sizeof($pages'

- name: Fix json.php Services_JSON constructor
  ansible.builtin.replace:
    path: /usr/local/pnp4nagios/share/application/lib/json.php
    regexp: 'function Services_JSON\('
    replace: 'function _construct('

- name: Fix json.php Services_JSON_Error constructor
  ansible.builtin.replace:
    path: /usr/local/pnp4nagios/share/application/lib/json.php
    regexp: 'function Services_JSON_Error\('
    replace: 'function _construct('

- name: Fix utf8.php mbstring overload constant
  ansible.builtin.replace:
    path: /usr/local/pnp4nagios/lib/kohana/system/core/utf8.php
    regexp: 'MB_OVERLOAD_STRING'
    replace: '2'

- name: Fix magic quotes function calls
  ansible.builtin.replace:
    path: "{{ item }}"
    regexp: 'get_magic_quotes_(gpc|runtime)\(\)'
    replace: 'false'
    backup: true
  loop:
    - /usr/local/pnp4nagios/lib/kohana/system/libraries/Input.php
    - /usr/local/pnp4nagios/share/application/vendor/fpdf/fpdf.php

- name: Remove npcd sysv init script
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/init.d/npcd
    - /etc/rc.d/init.d/npcd
  notify: restart npcd

- name: Deploy npcd systemd unit
  ansible.builtin.template:
    src: pnp4nagios/npcd.service
    dest: /etc/systemd/system/npcd.service
    mode: "0644"
  notify: restart npcd

- name: Deploy pnp4nagios npcd configuration
  ansible.builtin.template:
    src: pnp4nagios/npcd.cfg
    dest: /usr/local/pnp4nagios/etc/npcd.cfg
    mode: "0644"
  notify: restart npcd

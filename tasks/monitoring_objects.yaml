---
- name: Find shared monitoring object files
  ansible.builtin.find:
    paths: "{{ nagios_base_path }}"
    patterns: ['*.yaml', '*.yml']
    recurse: true
  register: __nagios_base_find
  delegate_to: localhost
  become: false
  changed_when: false
  when: nagios_base_path | length > 0

- name: Find tenant definition files
  ansible.builtin.find:
    paths: "{{ nagios_hosts_path }}"
    patterns: ['_tenant.yaml']
    recurse: true
  register: __nagios_tenant_find
  delegate_to: localhost
  become: false
  changed_when: false
  when:
    - nagios_hosts_path is defined
    - nagios_hosts_path | length > 0

- name: Load monitoring objects from inventory
  ansible.builtin.include_vars:
    file: "{{ __nagios_object_file }}"
    hash_behaviour: merge
  loop: >-
    {{ ((__nagios_base_find.files | default([])) + (__nagios_tenant_find.files | default([])))
       | map(attribute='path') | sort }}
  loop_control:
    loop_var: __nagios_object_file
    label: "{{ __nagios_object_file | basename }}"

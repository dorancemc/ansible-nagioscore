<VirtualHost *:80>
    RewriteEngine On
    RewriteCond %{HTTPS} !on
    RewriteCond %{REQUEST_URI} !^/.well-known/acme-challenge/
    RewriteRule (.*) https://%{HTTP_HOST}%{REQUEST_URI}
    ServerName {{ inventory_hostname }}
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html
</VirtualHost>
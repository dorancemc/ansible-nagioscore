define command {
    command_name    bootstrap_notify_nobody
    command_line    /bin/true
}

define command {
    command_name    bootstrap_check_ping
    command_line    $USER1$/check_ping -4 -H $HOSTADDRESS$ -w 3000.0,80% -c 5000.0,100% -p 5
}

define timeperiod {
    timeperiod_name    bootstrap-24x7
    alias    Bootstrap 24 Hours A Day, 7 Days A Week
    sunday    00:00-24:00
    monday    00:00-24:00
    tuesday    00:00-24:00
    wednesday    00:00-24:00
    thursday    00:00-24:00
    friday    00:00-24:00
    saturday    00:00-24:00
}

define contact {
    contact_name    nagios-bootstrap
    alias    Nagios bootstrap contact
    email    root@localhost
    host_notification_period    bootstrap-24x7
    service_notification_period    bootstrap-24x7
    host_notification_options    n
    service_notification_options    n
    host_notification_commands    bootstrap_notify_nobody
    service_notification_commands    bootstrap_notify_nobody
    host_notifications_enabled    0
    service_notifications_enabled    0
    register    1
}

define contactgroup {
    contactgroup_name    nagios-bootstrap
    alias    Nagios bootstrap contacts
    members    nagios-bootstrap
}

define host {
    host_name    nagios-bootstrap
    alias    Nagios bootstrap host
    address    127.0.0.1
    check_command    bootstrap_check_ping
    check_interval    5
    check_period    bootstrap-24x7
    contact_groups    nagios-bootstrap
    max_check_attempts    3
    notification_interval    0
    notification_period    bootstrap-24x7
    notifications_enabled    0
    process_perf_data    0
    retry_interval    1
    register    1
}

define service {
    host_name    nagios-bootstrap
    service_description    PING
    check_command    bootstrap_check_ping
    check_interval    5
    check_period    bootstrap-24x7
    contact_groups    nagios-bootstrap
    max_check_attempts    3
    notification_interval    0
    notification_period    bootstrap-24x7
    notifications_enabled    0
    process_perf_data    0
    retry_interval    1
    register    1
}

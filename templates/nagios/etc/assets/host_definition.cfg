{% set col1 = __host.keys()|map('length')|max %}
{% set fmt = "{:<" + col1|string + "}    {}" %}

define host {
    {{ fmt.format("host_name", __host.host_name) }}
    {{ fmt.format("use",__host.use|default(nagios_host_template_default)) }}
    {{ fmt.format("alias",__host.alias|default(__host.host_name)) }}
    {{ fmt.format("address",__host.address|default(__host.host_name)) }}
{% for key, value in __host.items() if key not in ['address','alias','host_name','name','use'] %}
    {{ fmt.format(key, value) }}
{% endfor %}
    {{ fmt.format("register","1") }}
}
